[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nitrom"
version = "0.1.0"
description = "Non-intrusive Trajectory-based Reduced-Order Modelling"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Alberto Padovan", email = "alberto.padovan.94@gmail.com" },
    { name = "Cole Errico", email = "cerrico2@illinois.edu" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "matplotlib",
    "torch",
    "dill",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["nitrom"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
