# Post-processing config for the 3D plate: the mesh and boundary
# conditions of config.yaml only -- no spatial operators (so no D/G/L
# assembly or Poisson setup), no immersed body, no time stepper.  Enough for
# incompreso's post-processing utilities (vorticity, Q-criterion), which
# need only the mesh and the BCs.  Keep the mesh and BC blocks in sync with
# config.yaml.

mesh:
  x:
    breakpoints: [-3, -2, -0.25, 1.25, 5, 10]
    spacings: [0.1, 0.035, 0.0125, 0.035, 0.1]
  y:
    breakpoints: [-3, -2, -0.75, 0]
    spacings: [0.1, 0.035, 0.0125]
    mirror: true
  z:
    breakpoints: [-3, -2, -0.75, 0]
    spacings: [0.1, 0.035, 0.0125]
    mirror: true
  check_equal_min_spacing: true

boundary_conditions:
  u:
    x0: { type: dirichlet, value: 1.0 }   # inflow
    x1: { type: neumann }                 # outflow
    y0: { type: dirichlet, value: 1.0 }   # freestream
    y1: { type: dirichlet, value: 1.0 }
    z0: { type: dirichlet, value: 1.0 }
    z1: { type: dirichlet, value: 1.0 }
  v:
    x0: { type: dirichlet, value: 0.0 }
    x1: { type: neumann }
    y0: { type: dirichlet, value: 0.0 }
    y1: { type: dirichlet, value: 0.0 }
    z0: { type: dirichlet, value: 0.0 }
    z1: { type: dirichlet, value: 0.0 }
  w:
    x0: { type: dirichlet, value: 0.0 }
    x1: { type: neumann }
    y0: { type: dirichlet, value: 0.0 }
    y1: { type: dirichlet, value: 0.0 }
    z0: { type: dirichlet, value: 0.0 }
    z1: { type: dirichlet, value: 0.0 }
